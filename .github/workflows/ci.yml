name: Money Changer CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Define environment variables available to all steps
    env:
      PYTHONPATH: .
      TZ: UTC

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest (API Logic & Schema Constraints)
      run: |
        pytest tests/ -v

    - name: Test Database Seeder (seed_db component)
      run: |
        # Assert the script executes properly without throwing any errors
        python scripts/seed_currencies.py

    - name: Test Daily Rate Synchronization (cron_sync component)
      run: |
        # Assert the cron script loops through permutations and connects to the internet properly
        # Make sure the seeder ran immediately prior so there are currencies to iterate over
        python scripts/sync_rates.py
